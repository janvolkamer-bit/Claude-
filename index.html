<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Biercounter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>🍺 Biercounter</h1>
</header>

<main>
  <section class="counter-card">
    <div class="counter-value" id="totalCount">0</div>
    <div class="counter-label">Biere insgesamt</div>
  </section>

  <section class="stats-card">
    <h2>Statistik</h2>
    <div class="field-row start-date-row">
      <label for="startDate">Start-Datum</label>
      <input type="date" id="startDate">
    </div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-value" id="todayCount">0</div>
        <div class="stat-label">Heute</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="weekCount">0</div>
        <div class="stat-label">Diese Woche</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="streakDaysCount">0</div>
        <div class="stat-label" id="streakDaysLabel">Trinktage seit Start</div>
      </div>
    </div>
    <div class="chart-row" id="weekChart"></div>
  </section>

  <section class="add-card">
    <h2>Bier eintragen</h2>
    <form id="addForm">
      <div class="field-row">
        <label>Getränk</label>
        <div class="chip-row" id="drinkChips"></div>
        <input type="text" id="drink" list="drinkOptions" placeholder="oder eigenes Getränk eintippen..." value="Bier">
        <datalist id="drinkOptions"></datalist>
      </div>

      <div class="field-row">
        <label>Größe</label>
        <div class="chip-row" id="sizeChips"></div>
        <input type="hidden" id="sizeInput" value="0,5l">
      </div>

      <div class="field-row">
        <label for="amount">Anzahl</label>
        <div class="stepper">
          <button type="button" id="decBtn" aria-label="Weniger">−</button>
          <input type="number" id="amount" min="1" value="1" inputmode="numeric">
          <button type="button" id="incBtn" aria-label="Mehr">+</button>
        </div>
      </div>

      <div class="field-row">
        <label for="note">Notiz (optional)</label>
        <input type="text" id="note" placeholder="z. B. Kneipe, Sorte, Anlass...">
      </div>

      <div class="field-row">
        <label for="photo">Foto (optional)</label>
        <div class="photo-buttons">
          <input type="file" id="photo" accept="image/*" capture="environment">
          <button type="button" id="dualCameraBtn" class="secondary-btn">📸 Beide Kameras gleichzeitig</button>
        </div>
        <img id="photoPreview" class="photo-preview" hidden>
        <button type="button" id="clearPhotoBtn" class="link-btn" hidden>Foto entfernen</button>
      </div>

      <button type="submit" class="primary-btn">🍺 Bier eintragen</button>
    </form>
  </section>

  <section class="history-card">
    <div class="history-header">
      <h2>Verlauf</h2>
      <button type="button" id="resetBtn" class="link-btn danger">Alles löschen</button>
    </div>
    <ul id="historyList" class="history-list"></ul>
    <p id="emptyState" class="empty-state">Noch keine Einträge. Prost! 🍻</p>
  </section>

  <section class="gallery-card">
    <h2>Foto-Galerie</h2>
    <div class="gallery-filters">
      <div class="field-row">
        <label for="galleryDrinkFilter">Getränk</label>
        <select id="galleryDrinkFilter">
          <option value="">Alle Getränke</option>
        </select>
      </div>
      <div class="field-row">
        <label for="galleryDateFilter">Datum</label>
        <input type="date" id="galleryDateFilter">
      </div>
      <div class="field-row">
        <label for="gallerySort">Sortierung</label>
        <select id="gallerySort">
          <option value="desc">Neueste zuerst</option>
          <option value="asc">Älteste zuerst</option>
        </select>
      </div>
      <button type="button" id="galleryResetBtn" class="link-btn">Filter zurücksetzen</button>
    </div>
    <div id="galleryGrid" class="gallery-grid"></div>
    <p id="galleryEmptyState" class="empty-state">Noch keine Fotos vorhanden.</p>
  </section>
</main>

<div id="cameraModal" class="camera-modal" hidden>
  <div class="camera-modal-inner">
    <div class="camera-preview-wrap">
      <video id="backVideo" class="camera-video back" autoplay playsinline muted></video>
      <video id="frontVideo" class="camera-video front" autoplay playsinline muted></video>
    </div>
    <p id="cameraStatus" class="camera-status">Kameras werden gestartet...</p>
    <div class="camera-modal-actions">
      <button type="button" id="captureBtn" class="primary-btn" hidden>Foto aufnehmen</button>
      <button type="button" id="cancelCameraBtn" class="link-btn">Abbrechen</button>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox" hidden>
  <button type="button" id="lightboxClose" class="lightbox-close" aria-label="Schließen">✕</button>
  <img id="lightboxImg" alt="Foto in groß">
  <div id="lightboxCaption" class="lightbox-caption"></div>
</div>

<script src="app.js"></script>
</body>
</html>
